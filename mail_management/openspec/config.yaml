# -----------------------------------------------------------------------------
# Testing capability + the DETECTED runnable command
# -----------------------------------------------------------------------------
testing:
  capability: true
  runner: docker-compose (Odoo native batch test mode)
  tests_dir_present: true              # tests/ has test_module.py (corrected this session) + __init__.py
  # IMPORTANT: do NOT use `docker compose exec -T web odoo ...` (the form the
  # sibling config uses). In THIS workspace it FAILS for two reasons:
  #   1. the mounted odoo.conf has NO db_host, and `exec` bypasses /entrypoint.sh
  #      (which injects db_host/db_user/db_password from env) -> Odoo falls
  #      back to a local PG socket and cannot connect.
  #   2. the web container already runs Odoo on 8069; a second `odoo` via exec
  #      hits `OSError: [Errno 98] Address already in use`.
  # The correct one-shot form is `docker compose run --rm --entrypoint odoo`
  # with explicit db connection. VERIFIED WORKING this session: module installs
  # clean and the suite runs GREEN (5 tests, 0 failures).
  command: |
    # install + test in a FRESH one-shot container (headless).
    # local_test is a throwaway dedicated DB (drop/recreate freely).
    docker compose run --rm -T --no-deps --entrypoint odoo web \
      -d local_test --db_host=db -r odoo -w odoo \
      -i mail_management --test-enable --stop-after-init \
      --test-tags=/mail_management
  retest_after_install: |
    # once installed, re-run tests with -u (update) for speed
    docker compose run --rm -T --no-deps --entrypoint odoo web \
      -d local_test --db_host=db -r odoo -w odoo \
      -u mail_management --test-enable --stop-after-init \
      --test-tags=/mail_management
  isolation_db_recommended: local_test
  evidence_location: container stdout/stderr (Odoo logs per-test PASS/FAIL/ERROR + summary)
  notes:
    - "Module is now INSTALLED in local_test (verified: state=installed, latest_version=19.0.1.0.0) and uninstalled in local_main_rs (shared dev, real data)."
    - "Prefer the DEDICATED test DB (local_test) to keep TDD evidence clean and avoid polluting shared dev data (local_main_rs)."
    - "No CI test workflow exists in this repo; the command above is the canonical, runnable, headless harness."
    - "No Makefile / no test wrapper script in the module."
    - "sdd-apply / sdd-verify MUST run this command to produce real RED/GREEN evidence and MUST NOT fabricate results they cannot actually run."

# -----------------------------------------------------------------------------
# strict_tdd verdict
# -----------------------------------------------------------------------------
strict_tdd: true
strict_tdd_reason: >
  A runnable, automatable (non-interactive) Odoo batch test command exists, the
  runtime is verified running (odoo:19.0 + postgres:17, all services Up), and a
  tests/ directory with a real test file is present. `odoo --test-enable
  --stop-after-init --test-tags=...` is a headless mode that logs per-test
  PASS/FAIL/ERROR, qualifying it as capable of producing real RED/GREEN evidence.
  This is NOT the 'manual/odoo-interactive with no CI harness' gap case that
  would force strict_tdd=false; the command is scriptable even though no CI job
  wraps it yet and the module is not yet installed in a DB.

# =============================================================================
# CRITICAL CHANGE CONTEXT — read in EVERY downstream phase
# -----------------------------------------------------------------------------
# This init immediately precedes the FIRST SDD change for mail_management. All
# downstream phases (explore/proposal/spec/design/tasks/apply/verify) MUST read
# this block.
# =============================================================================
change_context:
  intent: >
    Build an integrated webmail inside Odoo plus an AI assistant. Users configure
    and synchronize their own email mailboxes (IMAP/SMTP), then read, reply and
    forward mail like a webmail client (Roundcube/SnappyMail feature parity).
    An additional AI layer drafts replies, summarizes messages/threads, improves
    replies and provides conversation context. This is the EMAIL domain and is
    distinct from (complementary to) the sibling `message_management_ai`, which
    covers WhatsApp/Telegram messaging channels, not email.
  authoritative_reference: null        # to be authored in sdd-explore (IMAP/SMTP + Odoo mail gateway + AI provider reuse analysis)
  reference_doc_note: >
    Not yet written. sdd-explore should produce a technical reference covering:
    IMAP/SMTP options in the Odoo 19 ecosystem (mail.thread/mail.gateway/fetchmail
    vs a dedicated IMAP client lib), credential storage & encryption (security
    critical), message parsing (MIME/attachments/threads), webmail UI approach
    (OWL), and AI provider reuse from the sibling message_management_ai
    (message_ai_config / gemini_provider) to avoid reinventing the AI layer.
  proposed_change_slug: webmail-and-ai-assistant   # finalize in sdd-proposal
  tenancy:
    model: PER-USER MAILBOXES          # candidate — each Odoo user connects their own mailboxes; to confirm in proposal
    mechanism: IMAP/SMTP per mailbox config
    warning: >
      Storing email account credentials (passwords / OAuth tokens) is SECURITY
      CRITICAL. Decide encryption strategy (e.g. Encrypted field / vault) in
      design before any credential touches the DB.
  open_questions_for_proposal:
    - "Which IMAP/SMTP path: Odoo native mail gateway/fetchmail vs a dedicated Python IMAP lib (imaplib/imap-tools) inside the module?"
    - "Can the AI provider be REUSED from message_management_ai (message_ai_config / gemini_provider) instead of building a new one?"
    - "First-slice scope boundaries: what is the minimum viable webmail (inbox + read + reply) vs full Roundcube parity (folders, search, filters)?"
    - "Credential storage: Encrypted Char field, OAuth2, app passwords, or a secrets vault?"
    - "Sync strategy: cron-pull (fetchmail style) vs long-poll/IDLE vs on-demand fetch?"
    - "Non-goals for v1: calendar, contacts, full MIME rendering of all edge cases, send-later, etc.?"

